<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hulo · nikamma</title>
  <meta name="description" content="nikamma is a small independent music company from India.">
  <link rel="icon" href="../../img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../artist.css?v=11">
  <link rel="stylesheet" href="../../nav.css?v=4">
</head>
<body class="is-scroll" data-root="../../">

  <div class="ticker" aria-label="News"><div class="ticker__track" id="ticker"></div></div>

  <header class="top">
    <a href="../../index.html" class="top__logo" aria-label="nikamma, home"><img src="../../img/mark.png" alt="nikamma" width="140" height="134"></a>
    <nav class="top__nav" aria-label="Main">
      <a href="../../artists.html" aria-current="page">Artists</a>
      <a href="../../news.html">News</a>
      <a href="../../about.html">About</a>
    </nav>
  </header>

  <p class="acrumb"><a href="../../artists.html">artists</a> / <span id="artist-n"></span> / hulo</p>

  <main id="main" class="apage" data-artist="hulo">
    <!-- hero: name bottom-left, big photo on the right, on an off-white band -->
    <section class="ahero ahero--split">
      <div class="ahero__side">
        <h1 class="ahero__name" id="artist-name">Hulo</h1>
      </div>
      <figure class="ahero__photo">
        <div class="ahero__stage" id="hero-stage"><img id="artist-photo" alt=""></div>
        <figcaption class="ahero__bar">
          <span id="artist-credit"></span>
          <span class="ahero__nav" id="hero-nav" hidden>
            <button type="button" id="hero-prev" aria-label="Previous photo">←</button>
            <span id="hero-count"></span>
            <button type="button" id="hero-next" aria-label="Next photo">→</button>
          </span>
        </figcaption>
      </figure>
    </section>


    <!-- bio: plain text that runs down the page; follow links on the right -->
    <!-- bio + social links on the left, store in the right column -->
    <section class="abio" id="sec-bio">
      <div class="abio__main">
        <div class="bio__copy" id="artist-bio"></div>
        <div class="abio__follow">
          <p class="abio__label">follow hulo</p>
          <div class="ahero__icons" id="artist-links"></div>
          <p class="ahero__meta" id="artist-meta" hidden></p>
        </div>
        <div class="abio__music" id="sec-tracks">
          <p class="abio__label">music</p>
          <div class="player__frame" id="player"></div>
        </div>
      </div>
      <aside class="abio__store" id="sec-store" hidden>
        <p class="abio__label">store</p>
        <div class="store" id="store"></div>
        <a class="store__more" id="store-more" target="_blank" rel="noopener">more in the store</a>
      </aside>
    </section>

    <!-- press on the left, news on the right: same layout as bio + store -->
    <section class="abio abio--press" id="sec-press" hidden>
      <div class="abio__main">
        <p class="abio__label">press</p>
        <ol class="apress-list" id="press"></ol>
      </div>
      <aside class="abio__store abio__news">
        <p class="abio__label">news</p>
        <ol class="anews-list" id="news"></ol>
      </aside>
    </section>

    <!-- one full row: tour dates on the left, live photos on the right -->
    <section class="astage2" id="sec-stage">
      <div class="box box--tour" id="sec-tour" hidden>
        <h2>tour dates</h2>
        <div id="tour"></div>
      </div>
      <div class="box box--live" id="sec-live" hidden aria-label="Live">
        <figure class="live__stage"><img id="live-img" alt=""></figure>
        <div class="live__bar">
          <p class="live__caption" id="live-caption"></p>
          <div class="live__nav">
            <button type="button" id="live-prev" aria-label="Previous photo">←</button>
            <span id="live-count"></span>
            <button type="button" id="live-next" aria-label="Next photo">→</button>
          </div>
        </div>
      </div>
    </section>




    <section class="afilm" id="sec-video" hidden>
      <div class="afilm__inner">
        <div class="afilm__head">
          <h2>videos</h2>
          <a class="afilm__all" id="video-all" target="_blank" rel="noopener" hidden>more videos ↗</a>
        </div>
        <div class="afilm__frame" id="video-stage"></div>
      </div>
    </section>


  </main>

  <footer class="bar bar--note">
    <p class="bar__note">© <span class="year">2026</span> nikamma entertainment services private limited. made with claude tokens and very little sleep.</p>
  </footer>

  <script src="../../news.js?v=70"></script>
  <script src="../../artists.js?v=70"></script>
  <script src="../../merch.js?v=70"></script>
  <script src="../../bios.js?v=70"></script>
  <script src="../../posts.js?v=4"></script>
  <script src="../../press.js?v=70"></script>
  <script src="../artist.js?v=8"></script>
  <script src="../../nav.js?v=4"></script>
</body>
</html>
