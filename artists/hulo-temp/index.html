<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hulo (layout test) · nikamma</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="nikamma is a small independent music company from India.">
  <link rel="icon" href="../../img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="carpark.css?v=1">
</head>
<body class="is-scroll" data-root="../../">

  <div class="ticker" aria-label="News"><div class="ticker__track" id="ticker"></div></div>

  <header class="top">
    <a href="../../index.html" class="top__logo" aria-label="nikamma, home"><img src="../../img/logo.png" alt="nikamma" width="700" height="134"></a>
    <nav class="top__nav" aria-label="Main">
      <a href="../../artists.html" aria-current="page">Artists</a>
      <a href="../../work.html">Work</a>
      <a href="../../about.html">About</a>
      <a href="../../contact.html">Contact</a>
    </nav>
  </header>

  <p class="acrumb"><a href="../../artists.html">artists</a> / <span id="artist-n"></span> / hulo</p>

  <main id="main" class="apage" data-artist="hulo">
    <section class="ahero">
      <div class="ahero__top">
        <h1 class="ahero__name" id="artist-name">Hulo</h1>
        <div class="ahero__icons" id="artist-links"></div>
      </div>
      <div class="ahero__sub">
        <p class="ahero__meta" id="artist-meta"></p>
        <a class="ahero__contact" id="artist-contact" href="mailto:office@nikamma.co">contact</a>
      </div>
      <figure class="ahero__photo">
        <div class="ahero__stage" id="hero-stage"><img id="artist-photo" alt=""></div>
        <figcaption class="ahero__bar">
          <span id="artist-credit"></span>
          <span class="ahero__nav" id="hero-nav" hidden>
            <button type="button" id="hero-prev" aria-label="Previous photo">←</button>
            <span id="hero-count"></span>
            <button type="button" id="hero-next" aria-label="Next photo">→</button>
          </span>
        </figcaption>
      </figure>
    </section>

    <section class="box box--bio" id="sec-bio">
      <h2>bio</h2>
      <div class="bio__copy" id="artist-bio"></div>
    </section>

    <section class="box box--releases" id="sec-releases" hidden>
      <h2>releases</h2>
      <div class="rel">
        <a class="rel__covers" id="rel-covers" target="_blank" rel="noopener">
          <img class="rel__back" id="rel-back" alt="">
          <img class="rel__front" id="rel-front" alt="">
        </a>
        <div class="rel__text">
          <p class="rel__label" id="rel-label">latest release</p>
          <h3 class="rel__title" id="rel-title"></h3>
          <p class="rel__meta" id="rel-meta"></p>
          <a class="rel__link" id="rel-link" target="_blank" rel="noopener">listen / buy ↗</a>
          <div class="rel__nav" id="rel-nav">
            <button type="button" id="rel-prev" aria-label="Previous release">←</button>
            <span id="rel-count"></span>
            <button type="button" id="rel-next" aria-label="Next release">→</button>
          </div>
        </div>
      </div>
    </section>

    <section class="box box--tour" id="sec-tour" hidden>
      <h2>tour dates</h2>
      <div id="tour"></div>
    </section>


    <section class="afilm" id="sec-video" hidden>
      <div class="afilm__inner">
        <div class="afilm__head">
          <h2>videos</h2>
          <a class="afilm__all" id="video-all" target="_blank" rel="noopener" hidden>more videos ↗</a>
        </div>
        <div class="afilm__frame" id="video-stage"></div>
      </div>
    </section>

    <section class="box box--store" id="sec-store" hidden>
      <div class="store__head">
        <h2>merch</h2>
        <a class="store__more" id="store-more" target="_blank" rel="noopener">more in the store</a>
      </div>
      <div class="store" id="store"></div>
    </section>

    <nav class="artist__pager" aria-label="More artists">
      <a id="artist-prev" href="#"></a>
      <a id="artist-next" href="#"></a>
    </nav>
  </main>

  <footer class="bar">
    <div class="bar__links">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
    </div>
    <p class="bar__note">© <span class="year">2026</span> nikamma</p>
  </footer>

  <script src="../../news.js?v=57"></script>
  <script src="../../artists.js?v=57"></script>
  <script src="../../merch.js?v=57"></script>
  <script src="../../bios.js?v=57"></script>
  <script src="carpark.js?v=1"></script>
</body>
</html>
