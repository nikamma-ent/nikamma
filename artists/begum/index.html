<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Begum · nikamma</title>
  <meta name="description" content="nikamma is a small independent music company from India.">
  <link rel="icon" href="../../img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css?v=52">
</head>
<body class="is-scroll" data-root="../../">

  <div class="ticker" aria-label="News"><div class="ticker__track" id="ticker"></div></div>

  <header class="top">
    <a href="../../index.html" class="top__logo" aria-label="nikamma, home"><img src="../../img/logo.png" alt="nikamma" width="700" height="134"></a>
    <nav class="top__nav" aria-label="Main">
      <a href="../../artists.html" aria-current="page">Artists</a>
      <a href="../../work.html">Work</a>
      <a href="../../about.html">About</a>
      <a href="../../contact.html">Contact</a>
    </nav>
  </header>

  <main id="main" class="apage" data-artist="begum">
    <section class="ahero">
      <div class="ahero__inner">
        <div class="ahero__text">
          <p class="ahero__crumb"><a href="../../artists.html">artists</a> / <span id="artist-n"></span></p>
          <h1 class="ahero__name" id="artist-name">Begum</h1>
          <p class="ahero__meta" id="artist-meta"></p>
          <div class="ahero__icons" id="artist-links"></div>
          <a class="ahero__contact" id="artist-contact" href="mailto:office@nikamma.co">contact</a>
        </div>
        <figure class="ahero__photo"><img id="artist-photo" alt=""><figcaption id="artist-credit"></figcaption></figure>
      </div>
    </section>

    <div class="abody">
      <div class="abody__main">
        <section class="box box--bio" id="sec-bio">
          <h2>bio</h2>
          <div class="bio__copy" id="artist-bio"></div>
        </section>

        <section class="box box--tracks" id="sec-tracks">
          <h2>music</h2>
          <div class="player__frame" id="player"></div>
        </section>

      </div>

      <aside class="abody__side" id="sec-store" hidden>
        <h2>store</h2>
        <div class="store" id="store"></div>
        <a class="store__more" id="store-more" target="_blank" rel="noopener">more in the store</a>
      </aside>
    </div>

    <!-- on stage: tour dates + live photos, one black band across the page -->
    <div class="astage" id="sec-stage">
      <div class="astage__in">
        <section class="box box--tour" id="sec-tour" hidden>
          <h2>tour dates</h2>
          <div id="tour"></div>
        </section>

        <section class="box box--live" id="sec-live" hidden aria-label="Live">
          <figure class="live__stage"><img id="live-img" alt=""></figure>
          <div class="live__bar">
            <p class="live__caption" id="live-caption"></p>
            <div class="live__nav">
              <button type="button" id="live-prev" aria-label="Previous photo">←</button>
              <span id="live-count"></span>
              <button type="button" id="live-next" aria-label="Next photo">→</button>
            </div>
          </div>
        </section>
      </div>
    </div>

    <section class="afilm" id="sec-video" hidden>
      <div class="afilm__inner">
        <div class="afilm__head">
          <h2>videos</h2>
          <a class="afilm__all" id="video-all" target="_blank" rel="noopener" hidden>more videos ↗</a>
        </div>
        <div class="afilm__frame" id="video-stage"></div>
      </div>
    </section>

    <nav class="artist__pager" aria-label="More artists">
      <a id="artist-prev" href="#"></a>
      <a id="artist-next" href="#"></a>
    </nav>
  </main>

  <footer class="bar">
    <div class="bar__links">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://open.spotify.com/" target="_blank" rel="noopener">Spotify</a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener">YouTube</a>
    </div>
    <p class="bar__note">© <span class="year">2026</span> nikamma</p>
  </footer>

  <script src="../../news.js?v=52"></script>
  <script src="../../artists.js?v=52"></script>
  <script src="../../merch.js?v=52"></script>
  <script src="../../bios.js?v=52"></script>
  <script src="../../script.js?v=52"></script>
</body>
</html>
