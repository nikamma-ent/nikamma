<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta property="og:image" content="https://nikamma.co/img/home/nikamma-tht-stage.jpg">
  <link rel="icon" href="img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">

<body data-root="" class="is-scroll about-page home-big">

  <div class="ticker" aria-label="News"><div class="ticker__track" id="ticker"></div></div>

  <header class="top">
    <a href="index.html" class="top__logo" aria-label="nikamma, home"><img src="img/mark.png" alt="nikamma" width="140" height="134"></a>
    <nav class="top__nav" aria-label="Main">
      <a href="artists.html">Artists</a>
      <a href="news.html">News</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="main">
    <!-- like the artist pages: what we do on the left, a photo on the right (16:10.5).
         Photos live in img/home/ -->
    <section class="about2 hb-hero" id="about">
      <div class="about2__text">
        <h1 class="hb-what__label">what we do</h1>
        <ul class="hb-what">
          <li>artist development</li>
          <li>label + artist services</li>
          <li>live bookings</li>
          <li>event curation</li>
          <li>++</li>
        </ul>
      </div>
      <figure class="about2__photos hb-hero__photo">
        <img class="is-on" src="img/home/nikamma-tht-stage.jpg" alt="nikamma projected on a stage">
        <figcaption class="hb-hero__tag">we're in the monkey business.</figcaption>
      </figure>
    </section>

    <!-- second section: the nikamma playlist on the left, follow us on the right -->
    <section class="hb-listen">
      <div class="hb-listen__player">
        <h2 class="hb-listen__label">nikamma playlist</h2>
        <div class="hb-listen__embed" id="hb-playlist" data-playlist="https://open.spotify.com/playlist/7MWM35SZ2ELiFdjMHznTKh"></div>
      </div>
      <div class="hb-listen__follow">
        <h2 class="hb-listen__label">follow us</h2>
        <div class="hb__social">
          <a href="https://www.instagram.com/nikamma.hq/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.6" cy="7.4" r=".7" fill="currentColor" stroke="none"/></svg>
          </a>
          <a href="https://open.spotify.com/user/31zuv35stp57j7e33lh7fj5aghoi" target="_blank" rel="noopener" aria-label="Spotify" title="Spotify">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M7.4 9.8c3.3-.9 6.8-.5 9.4 1M7.9 12.7c2.7-.7 5.5-.4 7.8.9M8.5 15.4c2.1-.5 4.1-.3 5.9.7"/></svg>
          </a>
          <a href="mailto:office@nikamma.co" aria-label="Email" title="Email">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="M4 7l8 6 8-6"/></svg>
          </a>
        </div>
        <!-- mailing list: Kit form 10248609 (subscribers land in Kit; no confirmation email) -->
        <form class="hb-list" id="hb-list" action="https://app.kit.com/forms/10248609/subscriptions" method="post" target="_blank">
          <h2 class="hb-listen__label">join the mailing list</h2>
          <div class="hb-list__row">
            <label class="hb-list__sr" for="hb-list-email">email address</label>
            <input class="hb-list__input" id="hb-list-email" name="email_address" type="email" placeholder="your email" autocomplete="email" required>
            <button class="hb-list__btn" type="submit">join</button>
          </div>
          <p class="hb-list__note" id="hb-list-note" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="bar bar--note">
    <p class="bar__note">© <span class="year">2026</span> nikamma entertainment services private limited. made with claude tokens and very little sleep.</p>
  </footer>

  <script src="news.js?v=70"></script>

  <script src="nav.js?v=5"></script>
