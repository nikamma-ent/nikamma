name: Artist bios

on:
  schedule:
    - cron: '30 0 1 * *'   # 1st of every month, 6am in India
  workflow_dispatch:        # "Run workflow" button for a refresh right away

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/sync_bios.py
      - name: Commit if a bio changed
        run: |
          if git diff --quiet -- bios.js; then echo "No change."; exit 0; fi
          git config user.name "nikamma bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bios.js
          git commit -m "Update artist bios"
          git push
