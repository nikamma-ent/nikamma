name: Bandcamp merch

on:
  schedule:
    - cron: '30 0 * * *'   # every day, 6am in India
  workflow_dispatch:        # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/sync_bandcamp.py
      - name: Commit if merch changed
        run: |
          if git diff --quiet -- merch.js; then echo "No change."; exit 0; fi
          git config user.name "nikamma bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merch.js
          git commit -m "Update Bandcamp merch"
          git push
