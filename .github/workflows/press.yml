name: Press

on:
  schedule:
    - cron: '45 0 * * *'   # every day, 6:15am in India
  workflow_dispatch:        # "Run workflow" button for a search right away

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/sync_press.py
      - name: Commit if press changed
        run: |
          if git diff --quiet -- press.js; then echo "No change."; exit 0; fi
          git config user.name "nikamma bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add press.js
          git commit -m "Update press"
          git pull --rebase
          git push
