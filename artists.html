<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Artists · nikamma</title>
  <meta name="description" content="nikamma is a small independent music company from India.">
  <link rel="icon" href="img/mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,300;6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=71">
  <link rel="stylesheet" href="about.css?v=17">
  <link rel="stylesheet" href="nav.css?v=5">
</head>
<body data-root="" class="is-scroll about-page artists-page">

  <div class="ticker" aria-label="News"><div class="ticker__track" id="ticker"></div></div>

  <header class="top">
    <a href="index.html" class="top__logo" aria-label="nikamma, home"><img src="img/mark.png" alt="nikamma" width="140" height="134"></a>
    <nav class="top__nav" aria-label="Main">
      <a href="artists.html" aria-current="page">Artists</a>
      <a href="news.html">News</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- same layout as About: names on the left, the hovered artist's photo on the right -->
  <main id="main" class="about2-page">
    <section class="about2">
      <div class="about2__text">
        <h1 class="roster2__label">artists <span>(a–z)</span></h1>
        <div class="roster2-wheel"><ul class="roster2" id="roster2"></ul></div>
      </div>
      <figure class="about2__photos roster2__photos" id="roster2-photos" aria-label="Artist photo"></figure>
    </section>
  </main>

  <footer class="bar bar--note">
    <p class="bar__note">© <span class="year">2026</span> nikamma entertainment services private limited. made with claude tokens and very little sleep.</p>
  </footer>

  <script src="news.js?v=70"></script>
  <script src="artists.js?v=70"></script>
  <script src="posts.js?v=4"></script>
  <script src="script.js?v=70"></script>
  <script>
    // names A–Z on the left; hovering (or focusing) one shows that artist's photo on the right
    (function () {
      const list = document.getElementById('roster2');
      const box = document.getElementById('roster2-photos');
      const artists = (window.NIKAMMA_ARTISTS || []).slice().sort((a, b) => a.name.localeCompare(b.name));
      const imgs = {};
      artists.forEach((a, i) => {
        const im = document.createElement('img');
        im.src = `img/artists/${a.hero || a.photo}`; im.alt = a.name; // same photo as the top of their page
        if (i === 0) im.classList.add('is-on');
        box.append(im); imgs[a.slug] = im;

        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = `artists/${a.slug}/`; link.textContent = a.name;
        const show = () => {
          Object.values(imgs).forEach((x) => x.classList.toggle('is-on', x === im));
          list.querySelectorAll('a').forEach((x) => x.classList.toggle('is-active', x === link));
        };
        link.addEventListener('mouseenter', show);
        link.addEventListener('focus', show);
        li.append(link); list.append(li);
      });
      const first = list.querySelector('a'); if (first) first.classList.add('is-active');
      // phones: the names are a little wheel you swipe up and down (it snaps to a name);
      // the name in the middle is the one shown, and tapping it opens their page
      const wheelBox = list.parentElement;
      const links = [...list.querySelectorAll('a')];
      const phone = window.matchMedia('(max-width: 760px)');
      let current = 0;
      const wheel = () => {
        if (!phone.matches) { links.forEach((l) => { l.style.opacity = ''; }); return; }
        const row = links[0].parentElement.offsetHeight || 1;
        const p = wheelBox.scrollTop / row;
        links.forEach((l, i) => { l.style.opacity = String(Math.max(0.35, 1 - Math.abs(i - p) * 0.5)); });
        const n = Math.min(links.length - 1, Math.max(0, Math.round(p)));
        if (n !== current) { current = n; links[n].dispatchEvent(new Event('mouseenter')); }
      };
      wheelBox.addEventListener('scroll', wheel, { passive: true });
      phone.addEventListener('change', wheel);
      // tapping a faded name rolls it to the middle first; tapping the middle one opens it
      links.forEach((l, i) => l.addEventListener('click', (e) => {
        if (!phone.matches || i === current) return;
        e.preventDefault();
        wheelBox.scrollTo({ top: i * l.parentElement.offsetHeight, behavior: 'smooth' });
      }));
      wheel();
    })();
  </script>
  <script src="nav.js?v=5"></script>
</body>
</html>
